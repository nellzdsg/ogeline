<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>ОГЭлайн — бесплатный тренажёр по открытому банку ФИПИ</title>
    <meta
      name="description"
      content="Бесплатный тренажёр для подготовки к ОГЭ: задания из открытого банка ФИПИ, подсказки, подробные разборы и прогресс. Без регистрации."
    />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e121b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Превью ссылки в Telegram, ВК и других мессенджерах. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ОГЭлайн" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://nellzdsg.github.io/ogeline/" />
    <meta property="og:title" content="ОГЭлайн — тренажёр по открытому банку ФИПИ" />
    <meta
      property="og:description"
      content="863 задания по математике с подсказками и разбором. Задания — из открытого банка ФИПИ. Бесплатно, без регистрации."
    />
    <meta property="og:image" content="https://nellzdsg.github.io/ogeline/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ОГЭлайн — бесплатный тренажёр по открытому банку заданий ФИПИ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ОГЭлайн — тренажёр по открытому банку ФИПИ" />
    <meta
      name="twitter:description"
      content="863 задания по математике с подсказками и разбором. Задания — из открытого банка ФИПИ. Бесплатно, без регистрации."
    />
    <meta name="twitter:image" content="https://nellzdsg.github.io/ogeline/og.png" />

    <link rel="stylesheet" href="styles.css" />
    <script>
      // Тему выбираем до первой отрисовки, иначе страница мигнёт белым.
      try {
        var saved = localStorage.getItem('ogeline:theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#/" id="brand">
          <span class="brand__mark">ОГЭ</span><span class="brand__name">лайн</span>
        </a>
        <div class="topbar__sub">Открытый банк заданий ФИПИ</div>
        <button class="theme-toggle" id="theme-toggle" type="button" title="Сменить тему"></button>
      </div>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <footer class="footer">
      <p>
        ОГЭлайн — бесплатный тренажёр для подготовки к ОГЭ. Задания взяты из открытого банка
        заданий ФИПИ. Прогресс сохраняется в этом браузере и никуда не отправляется.
      </p>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
